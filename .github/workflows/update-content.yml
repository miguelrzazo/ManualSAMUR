name: Detect official manual updates

on:
  schedule:
    # Monthly (day 1) at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      procedure_ids:
        description: "Comma-separated procedure IDs to sync (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-production-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Initialize diagnostics
        run: mkdir -p /tmp/manual-update-diagnostics

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile --ignore-scripts

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Preserve the reviewed site assets
        run: |
          npm run build
          tar -cf /tmp/manual-reviewed-site.tar -C out .

      - name: Extract official candidates for editorial review
        id: extract
        env:
          PROCEDURE_IDS: ${{ inputs.procedure_ids }}
        run: |
          set -euo pipefail
          args=(apply --all --propose)
          if [ -n "$PROCEDURE_IDS" ]; then args+=("--ids=$PROCEDURE_IDS"); fi
          node --experimental-strip-types scripts/sync-manualsamur.ts "${args[@]}" 2>&1 | tee /tmp/manual-update-diagnostics/sync.log

      # Structural validation only. `npm test` is not a gate here: several tests pin
      # the committed snapshot (code counts, the bundled offline allowlist), so any
      # real upstream change failed them and blocked the proposal (run 41182571111).
      # The candidate is a D1 proposal that a person reviews before publishing;
      # code changes are still gated by npm test in ci.yml.
      - name: Validate the complete candidate before proposing backend changes
        id: validate
        run: |
          set -euo pipefail
          {
            npm run generate:client-data
            npm run generate:llms
            npm run generate:manual-history
            node --experimental-strip-types scripts/lint-procedure-ids.ts
            npm run mobile:content
            npm run mobile:content:validate
            npm run mobile:typecheck
            npm run build
            npm run validate:content-parity
          } 2>&1 | tee /tmp/manual-update-diagnostics/validation.log

      - name: Queue official proposals in the editorial backend
        id: propose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLICATION_ORIGIN: ${{ vars.PUBLICATION_ORIGIN || 'https://manualsamur.apta-academy.com' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing; the validated candidate could not be queued (docs/backend/credentials.md)."
            exit 1
          fi
          rm -rf out
          mkdir out
          tar -xf /tmp/manual-reviewed-site.tar -C out
          npm run backend:propose -- --remote 2>&1 | tee /tmp/manual-update-diagnostics/proposals.log

      - name: Generate update report
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.extract.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          PROPOSAL_OUTCOME: ${{ steps.propose.outcome }}
        run: |
          mkdir -p /tmp/manual-update-diagnostics
          node --experimental-strip-types scripts/report-manual-sync.ts > /tmp/manual-update-diagnostics/report.md
          cat /tmp/manual-update-diagnostics/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics and candidate snapshot
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: manual-update-detection-${{ github.run_id }}
          retention-days: 30
          path: |
            /tmp/manual-update-diagnostics
            content/data
            content/procedures
            docs
            public/docs
            public/images/procedures
          if-no-files-found: warn
