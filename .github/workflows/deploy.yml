name: Deploy to Cloudflare

# Production web/API host: https://manualsamur.apta-academy.com
# Replaces the former Vercel Git integration. Content publications (D1 + the
# attachments Worker) are activated separately by publish-content.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://manualsamur.apta-academy.com
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/backend/credentials.md)."
            exit 1
          fi

      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Migrations are additive and idempotent; applied before the Worker that needs them.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env production

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --env production

      - name: Smoke test the live origin
        run: |
          set -euo pipefail
          origin="https://manualsamur.apta-academy.com"
          for path in / /manual /vademecum /codigos /mapa /api/health /api/public/manifest; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$origin$path")
            echo "$path -> $status"
            test "$status" = "200"
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' "$origin/api/editor/session")
          echo "/api/editor/session (anonymous) -> $status"
          test "$status" = "401"
