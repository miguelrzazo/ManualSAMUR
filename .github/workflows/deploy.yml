name: Cloudflare credential check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify token and read account resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          for endpoint in "user/tokens/verify" "accounts/$CF_ACCOUNT/d1/database" "accounts/$CF_ACCOUNT/workers/scripts"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/$endpoint")
            case "$endpoint" in user/*) label=token;; */d1/*) label=D1;; *) label=Workers;; esac
            echo "$label: HTTP $status"
            test "$status" = 200
          done
