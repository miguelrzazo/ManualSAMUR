name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install mobile workspace dependencies
        run: npm ci --prefix apps/mobile --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Lint procedure IDs
        run: node --experimental-strip-types scripts/lint-procedure-ids.ts

      - name: Test
        run: npm test

      - name: Generate mobile content package
        run: npm run mobile:content

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Build
        run: npm run build
