name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install mobile workspace dependencies
        run: npm ci --prefix apps/mobile --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Lint procedure IDs
        run: node --experimental-strip-types scripts/lint-procedure-ids.ts

      - name: Test
        run: npm test

      - name: Generate mobile content package
        run: npm run mobile:content

      - name: Validate mobile content package
        run: npm run mobile:content:validate

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Build
        run: npm run build

      - name: Collect dated mobile release evidence
        env:
          MOBILE_BUILD_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MOBILE_EVIDENCE_TIMESTAMP: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mobile-release
          npm run mobile:release:evidence -- \
            --output="$PWD/artifacts/mobile-release/mobile-release-evidence.json" \
            --handoff-output="$PWD/artifacts/mobile-release/mobile-internal-test-handoff.json"
          cp apps/mobile/release/evidence-schema.json artifacts/mobile-release/
          cp apps/mobile/release/evidence-matrix.json artifacts/mobile-release/
          cp apps/mobile/release/field-validation-checklist.md artifacts/mobile-release/
          cp apps/mobile/release/human-review-checklist.md artifacts/mobile-release/

      - name: Retain release evidence and human handoff
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mobile-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mobile-release/
          if-no-files-found: error
          retention-days: 30

      - name: Check the build left no drift
        # public/procedures/*.md y llms*.txt se generan y se commitean. Hasta
        # ahora CI construía pero nunca miraba si la build cambiaba algo, así que
        # el corpus commiteado llevaba obsoleto desde 13a60ae y la deriva salió
        # a la luz en un diff de 232 ficheros. Si esto falla, ejecuta
        # `npm run build` en local y commitea lo que quede modificado.
        run: |
          set -euo pipefail
          DRIFT=$(git status --porcelain -- public content)
          if [ -n "$DRIFT" ]; then
            echo "La build ha modificado ficheros versionados:"
            echo "$DRIFT"
            echo ""
            git diff --stat -- public content
            exit 1
          fi
          echo "Sin deriva: la build no ha tocado nada versionado."
