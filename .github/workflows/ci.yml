name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint procedure IDs
        run: node --experimental-strip-types scripts/lint-procedure-ids.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build left no drift
        # public/procedures/*.md y llms*.txt se generan y se commitean. Hasta
        # ahora CI construía pero nunca miraba si la build cambiaba algo, así que
        # el corpus commiteado llevaba obsoleto desde 13a60ae y la deriva salió
        # a la luz en un diff de 232 ficheros. Si esto falla, ejecuta
        # `npm run build` en local y commitea lo que quede modificado.
        run: |
          set -euo pipefail
          DRIFT=$(git status --porcelain -- public content)
          if [ -n "$DRIFT" ]; then
            echo "La build ha modificado ficheros versionados:"
            echo "$DRIFT"
            echo ""
            git diff --stat -- public content
            exit 1
          fi
          echo "Sin deriva: la build no ha tocado nada versionado."
