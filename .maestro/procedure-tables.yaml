# Procedure tables render as aligned, horizontally scrollable native tables.
appId: es.madrid.samur.manual
tags:
  - ci
  - smoke
  - procedure-tables
---
- launchApp:
    clearState: true
- tapOn:
    text: "8081"
    optional: true
- tapOn:
    text: "Entendido, abrir el manual"
    optional: true
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      text: "Buscar en el manual"
    timeout: 15000
- tapOn:
    text: "Buscar en el manual"
- tapOn:
    id: "manual-search-input"
- inputText: "304_02"
- extendedWaitUntil:
    visible:
      id: "procedure-row-304_02"
    timeout: 5000
- tapOn:
    id: "procedure-row-304_02"
- scrollUntilVisible:
    element:
      text: "Alto riesgo"
    direction: DOWN
    timeout: 10000
- assertVisible: "Alto riesgo"
- assertVisible: "Edad"
- assertNotVisible: "| --- |"
- takeScreenshot: procedure-table-left-columns
- swipe:
    direction: LEFT
    duration: 500
- assertVisible: "Mínimo riesgo"
- takeScreenshot: procedure-table-right-columns
- back
- extendedWaitUntil:
    visible:
      id: "manual-search-input"
    timeout: 5000
- tapOn:
    id: "manual-search-input"
- eraseText: 10
- inputText: "314_06"
- extendedWaitUntil:
    visible:
      id: "procedure-row-314_06"
    timeout: 5000
- tapOn:
    id: "procedure-row-314_06"
- scrollUntilVisible:
    element:
      text: "Niño"
    direction: DOWN
    timeout: 10000
- assertVisible: "Niño"
- assertVisible: "Cabeza"
- assertVisible: "18%"
- assertNotVisible: "| --- |"
- takeScreenshot: procedure-table-two-columns
